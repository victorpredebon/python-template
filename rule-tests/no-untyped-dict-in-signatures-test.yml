id: no-untyped-dict-in-signatures
valid:
  - |
    def load(path: str) -> Settings:
        return Settings(**read(path))
  - |
    def count(words: list[str]) -> dict[str, int]:
        return Counter(words)
  - 'cache: dict[str, Any] = {}'
  - |
    def build() -> None:
        payload: dict[str, Any] = {}
        send(payload)
invalid:
  - |
    def load(path: str) -> dict[str, Any] | None:
        return read(path)
  - |
    def load(path: str) -> dict[str, Any]:
        return read(path)
  - |
    def save(data: dict[str, Any]) -> None:
        write(data)
  - |
    def send(payload: Mapping[str, object] = EMPTY) -> None:
        post(payload)
