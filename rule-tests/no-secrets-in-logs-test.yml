id: no-secrets-in-logs
valid:
  - logger.info('Loaded the API key from %s', source)
  - logger.info('Used %d input tokens', input_tokens)
  - logger.debug('Request %s finished', request_id)
  - "logger.info('Credentials loaded: %s', bool(settings))"
invalid:
  - logger.info('Using key %s', api_key)
  - "logger.debug('Settings: %s', settings.anthropic_api_key)"
  - logger.warning(f'Auth failed for token {access_token}')
  - "logging.error('Bad password: %s', password)"
  - log.exception('Call failed with %s', client_secret.get_secret_value())
