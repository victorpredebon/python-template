id: no-secrets-in-logs
language: python
severity: error
message: Don't log secrets (API keys, access tokens, passwords); log where they came from, never their value.
note: >-
  Logs end up in terminals, CI output, log aggregators and LLM tracing tools, none of
  them protected like a secret store, so a credential that reaches a log has leaked
  (OWASP Logging Cheat Sheet). The rule looks for secret-like names among the call's
  arguments; LLM token counts (`input_tokens`) are not secrets and are allowed.
rule:
  kind: call
  all:
    - has:
        field: function
        kind: attribute
        has:
          field: attribute
          regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
    - has:
        field: arguments
        has:
          stopBy: end
          kind: identifier
          regex: (?i)(secret|passw(or)?d|api_?key|access_?token|refresh_?token|auth_?token|bearer|credential|private_?key)
