# `make setup-pre-commit` (or plain `pre-commit install`) installs these git hooks.
default_install_hook_types: [pre-push, commit-msg]
# Hooks run on `git push` and on `pre-commit run` (the default stage, used by CI).
default_stages: [pre-commit, pre-push, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: pretty-format-json
        args: [--autofix]
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-illegal-windows-names
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: name-tests-test
        args: [--pytest-test-first]
  - repo: local
    hooks:
      # Never allowed, not even with approval: fix the code, or fix the rule in its own PR.
      - id: no-suppressions
        name: no suppression comments (noqa, type ignore, ast-grep-ignore, no cover)
        language: pygrep
        entry: '#.*\b(noqa|type:\s*ignore|pyright:\s*ignore|mypy:\s*ignore-errors|ast-grep-ignore|pragma:\s*no\s*cover)'
        types: [python]
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        # Checks the whole project (paths in [tool.mypy] files) so cross-module
        # errors are not missed when only some files changed.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (architecture contracts)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture
        language: system
        types: [python]
        pass_filenames: false
      - id: ast-grep
        name: ast-grep (project patterns in rules/)
        entry: uv run ast-grep scan
        language: system
        types: [python]
        pass_filenames: false
      - id: ast-grep-test
        name: ast-grep rule tests
        entry: uv run ast-grep test --skip-snapshot-tests
        language: system
        files: ^(rules/|rule-tests/|sgconfig\.yml$)
        pass_filenames: false
      - id: jscpd
        name: jscpd (duplicated code)
        entry: jscpd --exit-code 1
        language: node
        additional_dependencies: ["jscpd@5.4.1"]
        types: [python]
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      - id: zizmor
        name: zizmor (GitHub Actions security)
        entry: uv run zizmor --offline --min-severity low .github
        language: system
        files: ^\.github/
        pass_filenames: false
      - id: commitizen
        name: commitizen
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit --skip-editable
        language: system
        pass_filenames: false
        stages: [manual]
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        stages: [manual]
