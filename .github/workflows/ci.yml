name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly run so newly disclosed CVEs (pip-audit) surface even without pushes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# PR runs are superseded by newer pushes; runs on main are never cancelled
# mid-release (they queue instead).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs opt into more.
permissions: {}

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-poetry

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (ruff, mypy, zizmor, actionlint, file checks)
        run: poetry run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-poetry

      - name: Run tests with coverage
        shell: bash
        run: >-
          poetry run pytest -n auto
          --cov --cov-report=term-missing --cov-report=xml
          --junitxml=junit.xml

      - name: Coverage summary
        if: always() && runner.os == 'Linux'
        shell: bash
        run: poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-poetry

      - name: Audit dependencies for known vulnerabilities
        run: make audit

      - name: Check dependency hygiene
        run: make deps

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false

      # No cache: this job produces the artifacts that get released.
      - uses: ./.github/actions/setup-poetry
        with:
          install-args: --only build,release --no-root
          cache: "false"

      - name: Plan release version
        id: plan
        env:
          IS_RELEASE_RUN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          current="$(poetry version --short)"
          if [[ "${IS_RELEASE_RUN}" == "true" ]]; then
            # semantic-release writes its own step outputs (released=false on
            # --print); send them to /dev/null so they don't clash with ours.
            next="$(GITHUB_OUTPUT=/dev/null poetry run semantic-release version --print)"
            last="$(GITHUB_OUTPUT=/dev/null poetry run semantic-release version --print-last-released)"
          else
            next="${current}"
            last="${current}"
          fi
          if [[ "${next}" != "${last}" ]]; then released=true; else released=false; fi
          poetry version "${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "released=${released}" >> "$GITHUB_OUTPUT"
          echo "### Release plan: \`${last}\` → \`${next}\` (release: ${released})" >> "$GITHUB_STEP_SUMMARY"

      - name: Build sdist and wheel
        run: |
          poetry check --strict
          poetry build
          poetry run twine check --strict dist/*

      - name: Smoke test the wheel in a clean virtualenv
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/python" -m pip install --quiet dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/calculator"
          "${RUNNER_TEMP}/smoke/bin/python" -c "import calculator; assert calculator.sum_numbers(2, 3) == 5"
          unzip -l dist/*.whl | grep -q 'calculator/py.typed'

      - name: Generate SBOM (CycloneDX) and checksums
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          poetry run cyclonedx-py environment --of JSON \
            -o "dist/python_template-${VERSION}.cdx.json" "${RUNNER_TEMP}/smoke/bin/python"
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          {
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Single required status check for branch protection / rulesets.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, security, dependency-review, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "${NEEDS}" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  release:
    name: Release
    needs: [ci-ok, build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add protection rules (required reviewers, allowed branches) to this
    # environment in Settings → Environments to gate releases.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.build.outputs.version }}
    permissions:
      contents: write      # push the tag and create the GitHub release
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # semantic-release pushes with GH_TOKEN

      - uses: ./.github/actions/setup-poetry
        with:
          install-args: --only release --no-root
          cache: "false"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Verify artifacts match the planned version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          next="$(GITHUB_OUTPUT=/dev/null poetry run semantic-release version --print)"
          test "${next}" = "${VERSION}" || { echo "::error::planned ${VERSION}, computed ${next}"; exit 1; }
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: poetry run semantic-release version --no-commit --skip-build

      - name: Upload packages, SBOM and checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: poetry run semantic-release publish --tag "v${VERSION}"
