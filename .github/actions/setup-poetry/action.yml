name: Setup Python and Poetry
description: Install Python (from .python-version), a pinned Poetry and the project dependencies, with a cached virtualenv.

inputs:
  install-args:
    description: Extra arguments for `poetry install` (e.g. `--only release --no-root`).
    required: false
    default: ""
  poetry-version:
    description: Poetry version to install.
    required: false
    default: "2.4.3"

runs:
  using: composite
  steps:
    - id: setup-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version

    - name: Install Poetry
      shell: bash
      run: pipx install "poetry==${{ inputs.poetry-version }}" --python "${{ steps.setup-python.outputs.python-path }}"

    - name: Cache virtualenv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry${{ inputs.poetry-version }}-${{ hashFiles('poetry.lock') }}-${{ inputs.install-args }}

    - name: Install dependencies
      shell: bash
      run: poetry install ${{ inputs.install-args }}
