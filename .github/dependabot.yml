# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before adopting brand-new releases: most compromised packages are
    # detected and yanked within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    # Workflows plus the local composite action (Actions are pinned by SHA).
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # Wait before adopting brand-new releases: most compromised packages are
    # detected and yanked within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
