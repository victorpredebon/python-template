[project]
name = "python-template"
version = "1.0.0"
description = "A modern, opinionated Python boilerplate with linting, typing, testing and releases wired up."
authors = [{ name = "Victor Predebon", email = "predebonvictor@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4"
dependencies = []
keywords = ["template", "boilerplate", "uv", "ruff", "mypy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/victorpredebon/python-template"
Repository = "https://github.com/victorpredebon/python-template"
Issues = "https://github.com/victorpredebon/python-template/issues"
Changelog = "https://github.com/victorpredebon/python-template/releases"

[project.scripts]
calculator = "calculator.cli:main"


[dependency-groups]
dev = [
  "ruff>=0.17.5,<0.18",
  "pre-commit>=4.7.0,<5",
  "mypy>=2.4.1,<3",
  "pytest>=9.0.2,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-xdist>=3.8.0,<4",
  "commitizen>=4.19.3,<5",
  "pip-audit>=2.10.1,<3",
  "deptry>=0.25.1,<0.26",
  "hypothesis>=6",
  "zizmor>=1",
  "actionlint-py>=1.7",
  "mutmut>=3",
  "diff-cover>=9",
  "import-linter>=2",
  "vulture>=2",
  "ast-grep-cli>=0.39",
  "pytest-socket>=0.7",
]
# Packaging checks and SBOM: `uv sync --group build`
build = ["twine>=6", "cyclonedx-bom>=7"]
# Only needed by the CI release job: `uv sync --only-group release`
release = ["python-semantic-release>=10.7.0,<11"]


[tool.uv]
# Same uv everywhere (CI pins this version in .github/actions/setup-uv).
required-version = ">=0.11.32,<0.12"
# `uv sync` / `uv run` install only `dev`; `build` and `release` are opt-in.
default-groups = ["dev"]
# Supply-chain cooldown, like Dependabot's: ignore releases younger than a week
# (most compromised packages are detected and yanked within days).
exclude-newer = "7 days"

[tool.uv.build-backend]
module-name = "calculator"


[tool.ruff]
line-length = 88
indent-width = 4
# The oldest supported Python (requires-python), so code stays compatible with it.
target-version = "py312"
fix = true


[tool.ruff.lint]
select = ["ALL"]
# Opt into single preview rules by exact code only (explicit-preview-rules), so no
# other preview rule turns on: PLR6201 = use a set literal for membership tests.
preview = true
explicit-preview-rules = true
extend-select = ["PLR6201"]
ignore = [
  "D",   # pydocstyle (D)
  "COM", # flake8-commas (COM)
  "Q",   # flake8-quotes (Q)
  "CPY", # flake8-copyright (CPY)
]
fixable = ["ALL"]


[tool.ruff.lint.per-file-ignores]
# Standalone Claude Code hook scripts, run directly by path; not an importable package.
".agents/hooks/*.py" = ["INP001"]
"**/tests/**.py" = [
  "ANN",     # flake8-annotations (ANN)
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of `assert` detected
  "INP001",  # File is part of an implicit namespace package
]


[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88


[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2


[tool.ruff.lint.flake8-type-checking]
strict = true


# Commitizen is only used to validate commit messages (commit-msg hook).
# Versioning and changelog are owned by python-semantic-release.


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"


[tool.deptry]
known_first_party = ["calculator"]

[tool.deptry.package_module_name_map]
python-semantic-release = "semantic_release"
cyclonedx-bom = "cyclonedx_py"


# Architecture contracts: `lint-imports`. Add a contract when you add a layer.
[tool.importlinter]
root_package = "calculator"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The CLI sits on top of the core logic, never the other way around"
type = "layers"
layers = ["calculator.cli", "calculator.calc"]

[[tool.importlinter.contracts]]
name = "Core logic is pure: no I/O, logging or process control"
type = "forbidden"
source_modules = ["calculator.calc"]
forbidden_modules = ["logging", "os", "sys", "subprocess", "pathlib", "socket"]


# Dead code: functions, classes and attributes nothing uses.
[tool.vulture]
paths = ["."]
exclude = [".venv/", "mutants/", "build/", "dist/", ".git/"]


# Duplicated code (copy-paste, also within one file): jscpd, configured in .jscpd.json.


# New or changed lines must be fully covered: `make diff-cover` (after `make coverage`).
[tool.diff_cover]
compare_branch = "origin/main"
fail_under = 100


[tool.mypy]
# Type-check against the oldest supported Python; CI runs the tests on every version.
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", ".agents/hooks"]
strict = true


[tool.pytest]
testpaths = ["tests"]
# Unknown markers or config keys, unexpectedly passing xfails and duplicate
# parametrize ids are errors instead of being silently ignored.
strict = true
# Warnings (deprecations included) fail the test that raised them; ignore a
# specific one here, with the reason, only when it comes from a dependency.
filterwarnings = ["error"]
# importlib: tests never shadow each other or the installed package through
# sys.path, so they run against the package as it is installed. -ra lists the
# reason for every test that did not pass. --disable-socket (pytest-socket): tests
# can't reach the network, so they are fast, deterministic and never call a real
# API or LLM by accident; Unix sockets stay allowed for local IPC (asyncio, xdist).
addopts = ["--import-mode=importlib", "-ra", "--disable-socket", "--allow-unix-socket"]


[tool.coverage.run]
branch = true
source_pkgs = ["calculator"]

[tool.coverage.report]
fail_under = 80
show_missing = true


[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"


# Mutation testing: `make mutation`. Changes the code in small ways and checks
# that some test fails; a surviving mutant is behavior no test really checks.
[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-p", "no:xdist"]
also_copy = [".agents/hooks/"]
