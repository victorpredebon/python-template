[project]
name = "python-template"
version = "1.0.0"
description = "A modern, opinionated Python boilerplate with linting, typing, testing and releases wired up."
authors = [{ name = "Victor Predebon", email = "predebonvictor@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4"
dependencies = []

[project.scripts]
calculator = "calculator.cli:main"


[dependency-groups]
dev = [
  "ruff>=0.17.5,<0.18",
  "pre-commit>=4.7.0,<5",
  "mypy>=2.4.1,<3",
  "pytest>=9.0.2,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-xdist>=3.8.0,<4",
  "commitizen>=4.19.3,<5",
  "pip-audit>=2.10.1,<3",
  "deptry>=0.25.1,<0.26",
]
# Only needed by the CI release job: `poetry install --only release`
release = ["python-semantic-release>=10.7.0,<11"]


[tool.poetry]
packages = [{ include = "calculator", from = "src" }]

[tool.poetry.group.release]
optional = true


[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
fix = true


[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",   # pydocstyle (D)
  "COM", # flake8-commas (COM)
  "Q",   # flake8-quotes (Q)
  "CPY", # flake8-copyright (CPY)
]
fixable = ["ALL"]


[tool.ruff.lint.per-file-ignores]
"**/tests/**.py" = [
  "ANN",     # flake8-annotations (ANN)
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of `assert` detected
  "INP001",  # File is part of an implicit namespace package
]


[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88


[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2


[tool.ruff.lint.flake8-type-checking]
strict = true


# Commitizen is only used to validate commit messages (commit-msg hook).
# Versioning and changelog are owned by python-semantic-release.


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"


[tool.deptry]
known_first_party = ["calculator"]

[tool.deptry.package_module_name_map]
python-semantic-release = "semantic_release"


[tool.mypy]
mypy_path = "src"
files = ["src", "tests"]
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage.run]
branch = true
source_pkgs = ["calculator"]

[tool.coverage.report]
fail_under = 80
show_missing = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
